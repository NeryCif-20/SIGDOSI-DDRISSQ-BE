services:
  postgres:
    image: 'postgres:${POSTGRES_V}'
    environment:
      - 'POSTGRES_DB=${POSTGRES_NAME}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASS}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'TZ=America/Guatemala'
    ports:
      - '${POSTGRES_PORT}:5432'
  redis:
    image: 'redis:${REDIS_V}'
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASS}
      - --appendonly
      - 'yes'
    ports:
      - '${REDIS_PORT}:6379'
