spring.application.name=sigdosi

spring.config.import=optional:file:.env[.properties]

spring.messages.use-code-as-default-message=true

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_NAME:sigdosi}
spring.datasource.password=${POSTGRES_PASS}
spring.datasource.username=${POSTGRES_USER:postgres}

spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.password=${MAIL_PASS}
spring.mail.username=${MAIL_USER}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.cloud.aws.region.static=${AWS_REGION}
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
spring.cloud.aws.s3.enabled=${AWS_S3_ENABLE:false}

server.port=${SERVER_PORT:8000}

server.servlet.context-path=/api

springdoc.api-docs.enabled=${DOCS_ENABLE:false}
springdoc.swagger-ui.enabled=${DOCS_ENABLE:false}

app.zone=${ZONE:America/Guatemala}
app.client.origin=${CLIENT_ORIGIN}
app.cookies.same-site=${COOKIES_SITE:strict}
app.cookies.path=${COOKIES_PATH:/}
app.files.storage.type=${STORAGE_TYPE:local}
app.files.storage.local.path=${STORAGE_LOCAL_PATH}

iam.security.jwt.public-key=file:${JWT_PUBLIC_KEY}
iam.security.jwt.private-key=file:${JWT_PRIVATE_KEY}

iam.auth.flow-token.time-to-live=${FLOW_TTL:5m}
iam.auth.flow-token.cleanup=${FLOW_CLEANUP:0 */10 * * * *}

iam.auth.password-token.time-to-live=${PASS_TTL:10m}
iam.auth.password-token.cleanup=${PASS_CLEANUP:0 */20 * * * *}

iam.auth.refresh-token.time-to-live=${REFRESH_TTL:7d}
iam.auth.refresh-token.cleanup=${REFRESH_CLEANUP:0 */30 * * * *}

iam.auth.access-token.time-to-live=${ACCESS_TTL:15m}