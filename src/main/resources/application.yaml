spring:
  config:
    import:
      - optional:file:.env[.properties]
  application:
    name: sigdosi
  mvc:
    servlet:
      path: /api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_NAME:sigdosi}
    password: ${POSTGRES_PASS}
    username: ${POSTGRES_USER:postgres}
  servlet:
    multipart:
      max-file-size: 5MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    password: ${MAIL_PASS}
    username: ${MAIL_USER}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8000}

app:
  client:
    origin: ${CLIENT_ORIGIN:http://localhost:4200}
  cookies:
    same-site: ${COOKIES_SITE:strict}
    path: ${COOKIES_PATH:/}
  zone: ${ZONE:America/Guatemala}

iam:
  security:
    jwt:
      public-key: file:${JWT_PUBLIC_KEY}
      private-key: file:${JWT_PRIVATE_KEY}
  auth:
    flow-token:
      time-to-live: ${FLOW_TTL:5m}
    password-token:
      time-to-live: ${PASS_TTL:10m}
    refresh-token:
      time-to-live: ${REFRESH_TTL:7d}
    access-token:
      time-to-live: ${ACCESS_TTL:15m}
