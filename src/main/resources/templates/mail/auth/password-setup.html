<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${#messages.msg('template.mail.auth.set-password.' + action + '.subject')}"></title>
</head>
<body style="
    margin: 0;
    padding: 0;
    background: #f5f5f4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                 Helvetica, Arial, sans-serif;
    color: #1c1917;
">
<div style="
    padding: 32px 16px;
    background: #f5f5f4;
">
    <div style="
        width: 100%;
        max-width: 460px;
        margin: 0 auto;
        padding: 32px 40px;
        box-sizing: border-box;
        background: #ffffff;
        border: 1px solid #e7e5e4;
        border-radius: 10px;
    ">
        <th:block th:replace="~{mail/fragments/header :: header}">
        </th:block>
        <p style="font-size: 15px;" th:utext="#{template.mail.auth.password-setup.greeting(${name})}"></p>
        <p style="
            margin: 16px auto;
            font-size: 15px;
            line-height: 1.55;
            color: #57534e;
        " th:text="${#messages.msg('template.mail.auth.password-setup.' + action + '.body-text')}"></p>
        <th:block
                th:replace="
                    ~{mail/fragments/button :: button(${buttonLink}, ${#messages.msg('template.mail.auth.password-setup.' + action + '.button-text')})}
                ">
        </th:block>
        <p style="
            margin: 16px 0 0;
            font-size: 13px;
            line-height: 1.5;
            color: #a8a29e;
        " th:utext="#{template.mail.auth.password-setup.link-expires-at(${expiresAt})}"></p>
        <p style="
            margin: 16px 0 0;
            padding-top: 16px;
            border-top: 1px solid #e7e5e4;
            font-size: 13px;
            line-height: 1.5;
            color: #a8a29e;
            text-align: center;
        " th:text="#{template.mail.auth.password-setup.ignore-request}">
        </p>
    </div>
    <th:block th:replace="~{mail/fragments/footer :: footer}">
    </th:block>
</div>
</body>
</html>
