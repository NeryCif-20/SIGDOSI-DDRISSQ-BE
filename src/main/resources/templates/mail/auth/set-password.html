<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${#messages.msg('auth.email.' + action + '-password.subject')}"></title>
</head>
<body style="
    margin: 0;
    padding: 0;
    background: #f5f5f4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                 Helvetica, Arial, sans-serif;
    color: #1c1917;
">
<div style="
    padding: 32px 16px;
    background: #f5f5f4;
">
    <div style="
        width: 100%;
        max-width: 460px;
        margin: 0 auto;
        padding: 32px 40px;
        box-sizing: border-box;
        background: #ffffff;
        border: 1px solid #e7e5e4;
        border-radius: 10px;
    ">
        <th:block th:replace="~{fragments/header :: header}">
        </th:block>
        <p style="font-size: 15px;">
            <span th:text="#{auth.mail.set-password.greeting}"></span>
            <span style="font-weight: bold;" th:text="${name}"></span>:
        </p>
        <p style="
            margin: 16px auto;
            font-size: 15px;
            line-height: 1.55;
            color: #57534e;
        " th:text="${#messages.msg('auth.mail.' + action + '-password.body')}"></p>
        <th:block
                th:replace="
                    ~{fragments/button :: button(${buttonLink}, ${#messages.msg('auth.mail.' + action + '-password.button')})}
                ">
        </th:block>
        <p style="
            margin: 16px 0 0;
            font-size: 13px;
            line-height: 1.5;
            color: #a8a29e;
        ">
            <span th:text="#{auth.mail.set-password.link-expiration}"></span>
            <span style="font-weight: bold" th:text="${expiresAt}"></span>.
        </p>
        <p style="
            margin: 16px 0 0;
            padding-top: 16px;
            border-top: 1px solid #e7e5e4;
            font-size: 13px;
            line-height: 1.5;
            color: #a8a29e;
            text-align: center;
        " th:text="#{auth.mail.set-password.ignore}">
        </p>
    </div>
    <th:block th:replace="~{fragments/footer :: footer}">
    </th:block>
</div>
</body>
</html>
