<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">
        Establece tu contraseña
    </title>
</head>
<body style="
    margin: 0;
    padding: 0;
    background: #f5f5f4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                 Helvetica, Arial, sans-serif;
    color: #1c1917;
">
<div style="
    padding: 32px 16px;
    background: #f5f5f4;
">
    <div style="
        width: 100%;
        max-width: 460px;
        margin: 0 auto;
        padding: 32px 40px;
        box-sizing: border-box;
        background: #ffffff;
        border: 1px solid #e7e5e4;
        border-radius: 10px;
        text-align: center;
    ">
        <th:block th:replace="~{fragments/header :: header}">
        </th:block>
        <h1 style="
            margin: 0 0 12px;
            font-size: 22px;
            line-height: 1.35;
            font-weight: 600;
            color: #1c1917;
        "
            th:text="${title}">
            Establece tu contraseña
        </h1>
        <p style="
            margin: 0 auto 20px;
            max-width: 360px;
            font-size: 15px;
            line-height: 1.55;
            color: #57534e;
        ">
            Hola
            <span th:text="${name}">usuario</span>,
            hemos recibido una solicitud para
            <span th:text="${actionText}">
                establecer
            </span> la contraseña de tu cuenta.
        </p>
        <th:block
                th:replace="
                    ~{fragments/button :: button(${link}, ${buttonText})}
                ">
        </th:block>
        <p style="
            margin: 14px 0 0;
            font-size: 13px;
            line-height: 1.5;
            color: #a8a29e;
        ">
            Este enlace expira en
            <span th:text="${exp}">
                10m
            </span>
            por seguridad.
        </p>
        <p style="
            margin: 20px 0 0;
            padding-top: 16px;
            border-top: 1px solid #e7e5e4;
            font-size: 13px;
            line-height: 1.5;
            color: #a8a29e;
        ">
            Si no realizaste esta solicitud,
            puedes ignorar este correo.
        </p>
    </div>
    <th:block th:replace="~{fragments/footer :: footer}">
    </th:block>
</div>
</body>
</html>
